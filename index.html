<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Küçük Bir Sürpriz... 🕊️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Arka plan için estetik ve derinlikli bir Türk bayrağı çizim dokusu oluşturuldu */
            background: radial-gradient(circle at center, #800000 0%, #330000 50%, #0d0000 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
            position: relative;
        }

        /* Arka plana minimal ay-yıldız çizim silueti yerleştirme */
        body::before {
            content: "🇹🇷";
            position: absolute;
            font-size: 25rem;
            opacity: 0.04;
            pointer-events: none;
            user-select: none;
            z-index: 0;
        }

        /* Müzik Başlatma Ekranı */
        #music-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a0000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }

        .play-btn {
            background: #cc2222;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(204, 34, 34, 0.6);
            transition: transform 0.2s, background 0.2s;
        }

        .play-btn:hover {
            transform: scale(1.05);
            background: #e62222;
        }

        .container {
            text-align: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 40px 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 450px;
            width: 85%;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1.8s ease;
        }

        .container.show {
            opacity: 1;
            transform: translateY(0);
        }

        h1 {
            font-size: 2.1rem;
            margin-bottom: 20px;
            color: #ff4d4d;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.4);
        }

        p {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #e0e0e0;
            margin-bottom: 15px;
        }

        .highlight {
            font-weight: bold;
            color: #ff3333;
            font-size: 1.5rem;
            display: block;
            margin-top: 25px;
            text-shadow: 0 0 15px rgba(255, 51, 51, 0.6);
        }

        /* Küçük Parıltı Efektleri */
        .sparkle {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            bottom: -10px;
            animation: floatUp 7s infinite linear;
            opacity: 0.3;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-105vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Giriş Ekranı -->
    <div id="music-overlay">
        <p style="font-size: 1.3rem; margin-bottom: 20px; font-weight: 300; letter-spacing: 1px;">Senin için küçük bir şey bıraktım...</p>
        <button class="play-btn" onclick="startSurprise()">Tıkla ve Aç 🎵</button>
    </div>

    <!-- Fon Müziği (Duygusal Piyano) -->
    <iframe id="bg-music" width="1" height="1" src="" frameborder="0" allow="autoplay"></iframe>

    <div class="container" id="main-content">
        <p>Baktığım her yerde, düşündüğüm her güzel detayda bir şekilde aklıma gelmeyi başarıyorsun.</p>
        <p>Hayatımda başladığın bu tatlı iz, her geçen gün çok daha anlamlı ve özel bir yere dönüşüyor.</p>
        <h1>İyi ki varsın,</h1>
        <span class="highlight">Kalbimdeki cumhuriyet sensin! ❤️</span>
    </div>

    <script>
        function startSurprise() {
            const overlay = document.getElementById('music-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => overlay.remove(), 1000);

            // Müzik açılışı
            const music = document.getElementById('bg-music');
            music.src = "https://youtube.com";

            // Metin animasyonu
            setTimeout(() => {
                document.getElementById('main-content').classList.add('show');
            }, 400);

            // Arka planda yumuşak ışık parıltıları uçurma
            setInterval(createSparkle, 200);
        }

        function createSparkle() {
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            sparkle.style.left = Math.random() * 100 + "vw";
            sparkle.style.animationDuration = Math.random() * 3 + 5 + "s";
            
            const size = Math.random() * 4 + 3;
            sparkle.style.width = size + "px";
            sparkle.style.height = size + "px";
            if(Math.random() > 0.5) {
                sparkle.style.background = "#ff4d4d"; // Bazı parıltılar kırmızı tonlarında
            }
            
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 7000);
        }
    </script>
</body>
</html>
