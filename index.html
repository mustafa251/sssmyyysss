<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadece Senin İçin... ✨</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #2b0000 0%, #0a0000 70%, #000000 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
            position: relative;
        }

        .bg-neon-sign {
            position: absolute;
            font-size: 20rem;
            opacity: 0.03;
            filter: drop-shadow(0 0 50px #ff0000);
            pointer-events: none;
            user-select: none;
            z-index: 0;
            animation: pulseSign 4s infinite alternate;
        }

        /* CAFCAFLI NEON GİRİŞ EKRANI */
        #music-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 1s cubic-bezier(0.74, 0.03, 0.17, 0.96);
        }

        .neon-circle {
            position: absolute;
            width: 280px;
            height: 280px;
            border: 2px dashed rgba(255, 26, 26, 0.3);
            border-radius: 50%;
            animation: rotateCircle 15s linear infinite;
        }

        .overlay-title {
            font-size: 1.4rem;
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ff4d4d;
            text-shadow: 0 0 15px rgba(255, 77, 77, 0.7);
            z-index: 102;
            text-align: center;
            padding: 0 20px;
        }

        .play-btn {
            background: transparent;
            color: #fff;
            border: 2px solid #ff1a1a;
            padding: 20px 50px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            z-index: 102;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #ff1a1a;
            box-shadow: 0 0 20px rgba(255, 26, 26, 0.4), inset 0 0 15px rgba(255, 26, 26, 0.3);
            transition: all 0.3s ease;
            animation: neonPulse 1.5s infinite alternate;
        }

        .play-btn:hover {
            background: #ff1a1a;
            color: #000;
            box-shadow: 0 0 45px #ff1a1a, 0 0 70px #ff1a1a;
            text-shadow: none;
            transform: scale(1.05);
        }

        /* ANA SÜRPRİZ KUTUSU */
        .container {
            text-align: center;
            z-index: 10;
            background: rgba(10, 0, 0, 0.8);
            padding: 50px 35px;
            border-radius: 28px;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 26, 26, 0.15);
            border: 1px solid rgba(255, 26, 26, 0.25);
            max-width: 440px;
            width: 85%;
            opacity: 0;
            transform: scale(0.85);
            transition: all 1.8s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .container.show {
            opacity: 1;
            transform: scale(1);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 25px;
            color: #ff4d4d;
            text-shadow: 0 0 15px rgba(255, 77, 77, 0.5);
        }

        p {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #e5e5e5;
            margin-bottom: 18px;
            font-weight: 300;
        }

        .highlight {
            font-weight: bold;
            color: #ff2222;
            font-size: 1.6rem;
            display: block;
            margin-top: 30px;
            text-shadow: 0 0 25px rgba(255, 34, 34, 0.8);
            letter-spacing: 0.5px;
        }

        /* UÇUŞAN KÜÇÜK RESİMLERİNİZ */
        .particle {
            position: absolute;
            pointer-events: none;
            bottom: -80px;
            animation: floatUp 7s infinite linear;
            opacity: 0;
            z-index: 2;
            width: 55px;
            height: 70px;
            background-image: url('https://squarespace-cdn.com');
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 26, 26, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes rotateCircle {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes neonPulse {
            0% { box-shadow: 0 0 15px rgba(255, 26, 26, 0.4), inset 0 0 10px rgba(255, 26, 26, 0.2); }
            100% { box-shadow: 0 0 30px rgba(255, 26, 26, 0.8), inset 0 0 20px rgba(255, 26, 26, 0.5); transform: scale(0.98); }
        }

        @keyframes pulseSign {
            0% { opacity: 0.02; transform: scale(1); }
            100% { opacity: 0.05; transform: scale(1.05); }
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0.7); opacity: 0; }
            15% { opacity: 0.6; }
            85% { opacity: 0.6; }
            100% { transform: translateY(-115vh) rotate(360deg) scale(1.1); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="bg-neon-sign">🇹🇷</div>

    <div id="music-overlay">
        <div class="neon-circle"></div>
        <p class="overlay-title">Senin İçin Küçük Bir Sürpriz...</p>
        <button class="play-btn" onclick="startSurprise()">BAŞLAT ✨</button>
    </div>

    <iframe id="bg-music" width="1" height="1" src="" frameborder="0" allow="autoplay"></iframe>

    <div class="container" id="main-content">
        <p>Baktığım her yerde, düşündüğüm her güzel detayda bir şekilde aklıma gelmeyi başarıyorsun.</p>
        <p>Hayatımda başladığın bu tatlı iz, her geçen gün çok daha anlamlı ve özel bir yere dönüşüyor.</p>
        <h1>İyi ki varsın,</h1>
        <span class="highlight">çünkü kalbimdeki cumhuriyet sensin! ❤️</span>
    </div>

    <script>
        function startSurprise() {
            const overlay = document.getElementById('music-overlay');
            overlay.style.opacity = '0';
            overlay.style.transform = 'translateY(-100vh)';
            setTimeout(() => overlay.remove(), 1000);

            const music = document.getElementById('bg-music');
            music.src = "https://youtube.com";

            setTimeout(() => {
                document.getElementById('main-content').classList.add('show');
            }, 500);

            setInterval(createParticle, 500);
        }

        function createParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            particle.style.left = Math.random() * 85 + "vw";
            particle.style.animationDuration = Math.random() * 3 + 5 + "s";
            
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 7000);
        }
    </script>
</body>
</html>
